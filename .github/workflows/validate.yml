name: Validate portfolio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Build the actual Astro source
        run: npm run build
      - name: Typecheck bilingual dictionaries
        run: npx tsc --noEmit
      - name: Validate localized build and browser language detection
        run: npm run check:i18n
      - name: Validate Cloudflare deployment bundle (no deploy)
        run: npx wrangler deploy --dry-run
